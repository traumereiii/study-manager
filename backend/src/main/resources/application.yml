spring:
  application:
    name: chagok-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chagok?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:chagok}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: 16MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: chagok
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
